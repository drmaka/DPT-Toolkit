[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpt-toolkit"
version = "1.0.0"
description = "Auditable software for the 30-step Discovery Plane Theory workflow"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Mohammad Amir Khusru Akhtar"}]
keywords = ["research methodology", "scientific questions", "decision science", "discovery"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "networkx>=3.1"
]

[project.optional-dependencies]
app = ["streamlit>=1.35", "plotly>=5.20"]
stats = ["scipy>=1.10", "scikit-learn>=1.3"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
dpt = "dpt_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
