project:
  title: Human-Robot Collaboration in Warehouses
  domain: robotics
  version: '1.0'
reality_space:
- Warehouses combine repetitive movement, picking, packing, and exception handling.
- Robots can improve throughput but operate under safety constraints.
- Product variety and order patterns change over time.
- Human workers provide flexibility and contextual judgment.
- Poor task allocation can create congestion or ergonomic risks.
- Deployment decisions must consider cost, safety, and workforce impact.
background_knowledge:
- Robotics
- Human factors
- Operations research
- Computer vision
- Occupational safety
