project:
  title: Early Warning for Student Dropout
  domain: education
  version: '1.0'
reality_space:
- Student dropout is influenced by academic, financial, social, and personal factors.
- Attendance and assessment data are available during the semester.
- Students may be harmed by inaccurate risk labels.
- Institutions have limited counselling resources.
- Interventions differ in cost and effectiveness.
- Data privacy and fairness must be protected.
background_knowledge:
- Learning analytics
- Educational psychology
- Statistics
- Fairness in AI
- Student support services
