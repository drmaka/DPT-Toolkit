project:
  title: Inflation Dynamics and Policy Response
  domain: economics
  version: '1.0'
reality_space:
- Inflation can arise from demand, supply, expectations, exchange rates, and policy.
- Price changes differ across sectors and household groups.
- Official indices aggregate heterogeneous consumption patterns.
- Monetary policy operates with uncertain lags.
- Global commodity shocks can affect domestic prices.
- Policy responses involve trade-offs among inflation, growth, and employment.
background_knowledge:
- Macroeconomics
- Time-series econometrics
- Monetary policy
- Input-output analysis
- Household expenditure surveys
