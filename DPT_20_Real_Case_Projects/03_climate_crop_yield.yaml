project:
  title: Climate-Smart Crop Yield Prediction
  domain: agriculture
  version: '1.0'
reality_space:
- Crop yields vary across seasons and districts.
- Rainfall timing and temperature extremes affect crop growth.
- Soil quality and irrigation access differ substantially across farms.
- Satellite imagery provides repeated observations of vegetation condition.
- Ground-truth yield records can be sparse or delayed.
- Farmers need forecasts early enough to support management decisions.
background_knowledge:
- Agronomy
- Remote sensing
- Climate science
- Geospatial analysis
- Machine learning
