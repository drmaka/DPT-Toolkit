project:
  title: Precision Medicine for Treatment Response
  domain: medicine
  version: '1.0'
reality_space:
- Patients with the same diagnosis can respond differently to the same treatment.
- Clinical records contain demographic, laboratory, imaging, and medication information.
- Genomic and molecular data are not routinely available for every patient.
- Treatment decisions must satisfy safety, privacy, and ethical requirements.
- Hospital data may be incomplete, heterogeneous, and institution-specific.
- Prospective validation is required before clinical deployment.
background_knowledge:
- Clinical epidemiology
- Biostatistics
- Pharmacogenomics
- Machine learning
- Research ethics
