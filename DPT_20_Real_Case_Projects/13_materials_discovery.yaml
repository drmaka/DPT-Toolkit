project:
  title: AI-Assisted Materials Discovery
  domain: materials-science
  version: '1.0'
reality_space:
- Material properties depend on composition, structure, synthesis, and processing.
- Experimental search spaces can be extremely large.
- Published data are heterogeneous and biased toward successful experiments.
- Simulations provide useful but imperfect approximations.
- Laboratory validation remains necessary.
- Target applications require multiple properties simultaneously.
background_knowledge:
- Materials informatics
- Computational chemistry
- Machine learning
- High-throughput experimentation
- Multi-objective optimisation
