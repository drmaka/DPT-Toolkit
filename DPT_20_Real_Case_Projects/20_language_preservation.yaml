project:
  title: Digital Preservation of Endangered Languages
  domain: linguistics-and-digital-humanities
  version: '1.0'
reality_space:
- Many endangered languages have few fluent speakers.
- Existing recordings and texts may be incomplete or inaccessible.
- Writing systems and orthographic conventions may vary.
- Language data can contain culturally sensitive knowledge.
- Automatic speech and language tools perform poorly with limited data.
- Community ownership and consent are essential.
background_knowledge:
- Sociolinguistics
- Language documentation
- Speech technology
- Digital archives
- Research ethics
