project:
  title: Detection and Characterisation of Exoplanets
  domain: astronomy
  version: '1.0'
reality_space:
- Exoplanets can be inferred through transit, radial-velocity, imaging, and timing observations.
- Signals are weak and may be confused with stellar activity or instrumental noise.
- Observing time on major telescopes is limited.
- Different methods provide complementary constraints.
- Atmospheric characterisation requires high-quality spectra.
- Candidate confirmation often needs observations across instruments.
background_knowledge:
- Astrophysics
- Signal processing
- Bayesian inference
- Spectroscopy
- Telescope instrumentation
