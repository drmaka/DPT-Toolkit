project:
  title: Biodiversity Monitoring and Conservation Prioritisation
  domain: ecology
  version: '1.0'
reality_space:
- Species distributions change with habitat, climate, disturbance, and human activity.
- Field surveys provide detailed but spatially limited observations.
- Camera traps, acoustic sensors, satellites, and citizen science offer complementary data.
- Rare species are difficult to detect.
- Conservation budgets are limited.
- Interventions must consider ecological value and local communities.
background_knowledge:
- Conservation biology
- Remote sensing
- Ecological modelling
- Decision analysis
- Community-based conservation
