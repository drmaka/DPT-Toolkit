project:
  title: Urban Air-Quality Forecasting and Intervention
  domain: environmental-science
  version: '1.0'
reality_space:
- Urban air pollution varies by location and time.
- Traffic, industry, weather, and construction contribute to particulate matter.
- Regulatory monitors provide accurate but spatially sparse measurements.
- Low-cost sensors provide denser but noisier observations.
- Pollution episodes create public-health risks.
- Authorities need actionable forecasts and intervention options.
background_knowledge:
- Atmospheric science
- Environmental monitoring
- Time-series forecasting
- Public health
- Urban policy
