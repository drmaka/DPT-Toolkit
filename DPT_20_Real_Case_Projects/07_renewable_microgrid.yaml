project:
  title: Renewable-Energy Microgrid Optimisation
  domain: electrical-engineering
  version: '1.0'
reality_space:
- Solar and wind generation are variable.
- Electricity demand changes hourly and seasonally.
- Battery storage has financial and degradation costs.
- Grid outages may interrupt critical services.
- Demand response can shift some loads.
- Microgrid operation must satisfy safety and reliability constraints.
background_knowledge:
- Power systems
- Renewable energy
- Battery systems
- Optimisation
- Demand response
