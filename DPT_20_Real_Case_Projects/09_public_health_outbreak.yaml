project:
  title: Public-Health Outbreak Early Warning
  domain: public-health
  version: '1.0'
reality_space:
- Infectious-disease outbreaks can grow before laboratory confirmation is complete.
- Clinical reports, pharmacy sales, mobility, wastewater, and search behaviour provide indirect signals.
- Signals differ in timeliness, coverage, and reliability.
- False alarms can consume public-health resources.
- Data sharing across institutions may be delayed.
- Interventions must be proportional and ethically justified.
background_knowledge:
- Epidemiology
- Syndromic surveillance
- Wastewater epidemiology
- Time-series analysis
- Public-health ethics
