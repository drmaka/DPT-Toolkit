project:
  title: Adaptive Cyber-Intrusion Detection
  domain: cybersecurity
  version: '1.0'
reality_space:
- Enterprise networks generate large volumes of security telemetry.
- Attack techniques evolve and may imitate legitimate behaviour.
- Labelled attack data are incomplete and quickly become outdated.
- Detection systems must balance sensitivity with alert fatigue.
- Encrypted traffic limits direct content inspection.
- Human analysts need interpretable evidence for incident response.
background_knowledge:
- Network security
- Threat intelligence
- Machine learning
- Anomaly detection
- Digital forensics
