project:
  title: Explainable Financial-Fraud Detection
  domain: finance
  version: '1.0'
reality_space:
- Fraudulent transactions are rare relative to legitimate transactions.
- Fraud patterns change as detection systems evolve.
- Transaction data contain temporal, behavioural, and network information.
- False positives can inconvenience customers and increase investigation costs.
- Financial institutions must satisfy privacy and regulatory requirements.
- Model explanations are important for human review.
background_knowledge:
- Fraud analytics
- Anomaly detection
- Graph machine learning
- Risk management
- Financial regulation
