project:
  title: Supply-Chain Disruption Resilience
  domain: operations-management
  version: '1.0'
reality_space:
- Supply chains face transport, supplier, geopolitical, and demand disruptions.
- Visibility beyond direct suppliers is often incomplete.
- Inventory buffers improve resilience but increase cost.
- Alternative suppliers differ in quality, capacity, and lead time.
- Disruptions can propagate through interconnected networks.
- Decisions must balance efficiency, resilience, and sustainability.
background_knowledge:
- Supply-chain management
- Network science
- Risk analysis
- Optimisation
- Forecasting
