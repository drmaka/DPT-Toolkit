project:
  title: River Water-Quality Monitoring
  domain: environmental-engineering
  version: '1.0'
reality_space:
- River water quality changes with rainfall, discharge, agriculture, industry, and sewage.
- Laboratory testing is accurate but infrequent.
- In-situ sensors can provide continuous but noisy measurements.
- Pollution sources may be diffuse or intermittent.
- Communities depend on timely warnings.
- Regulators need evidence linking pollution patterns to possible sources.
background_knowledge:
- Hydrology
- Water chemistry
- Environmental sensors
- Source apportionment
- Environmental regulation
