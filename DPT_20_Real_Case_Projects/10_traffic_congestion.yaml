project:
  title: Urban Traffic Congestion Management
  domain: transportation
  version: '1.0'
reality_space:
- Traffic demand varies by time, location, weather, and events.
- Road networks contain recurring bottlenecks.
- Signal timing influences queue formation.
- Public transport and parking policies affect travel behaviour.
- Navigation apps may redistribute congestion.
- Authorities require interventions that are fair and practical.
background_knowledge:
- Traffic engineering
- Operations research
- Urban planning
- Simulation
- Intelligent transport systems
